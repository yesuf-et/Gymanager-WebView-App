name: Build Gymanager WebView App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16'

      - name: Install dependencies
        run: |
          npm install
      
      - name: Build Gymanager App
        run: |
          nativefier "https://www.gym.etecxperts.com" --name "Gymanager" --icon "path/to/icon.icns"
      
      - name: Upload app artifact
        uses: actions/upload-artifact@v2
        with:
          name: Gymanager-App
          path: ./path/to/app/output
