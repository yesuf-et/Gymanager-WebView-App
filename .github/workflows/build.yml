name: Build Gymanager WebView App

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Nativefier
        run: npm install -g nativefier

      - name: Create output directory
        run: New-Item -Path "./dist" -ItemType Directory -Force

      - name: Build the WebView App
        run: |
          nativefier `
            --name "Gymanager" `
            --platform windows `
            --icon "./assets/gymanager.ico" `
            --out ./dist `
            "https://www.gym.etecxperts.com"
        shell: pwsh

      - name: Verify build output
        run: |
          Write-Output "Build output contents:"
          Get-ChildItem -Path ./dist -Recurse

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gymanager-App
          path: ./dist
