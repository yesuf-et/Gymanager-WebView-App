name: Build Gymanager WebView App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest  # Runs on Windows environment to build the .exe

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v2

      # Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16'  # Set Node.js version you prefer

      # Install Nativefier globally
      - name: Install Nativefier
        run: |
          npm install -g nativefier

      # Build the app for Windows
      - name: Build Gymanager WebView App for Windows
        run: |
          nativefier "https://www.gym.etecxperts.com" --name "Gymanager" --icon "path/to/icon.ico" --platform windows

      # Upload the .exe artifact (Windows app)
      - name: Upload app artifact
        uses: actions/upload-artifact@v2
        with:
          name: Gymanager-Windows-App
          path: ./GymanagerSetup.exe  # Specify the path to the .exe after it's created
