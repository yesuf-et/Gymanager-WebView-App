name: Build Gymanager WebView App

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Nativefier
        run: npm install -g nativefier

      - name: Build WebView App
        run: |
          # Create output directory
          mkdir -p dist
          # Run Nativefier with absolute path
          nativefier \
            --name "Gymanager" \
            --platform windows \
            --icon "$(Get-Location)/assets/gymanager.ico" \
            --out ./dist \
            "https://www.gym.etecxperts.com"
          # Verify build
          ls -R ./dist

      - name: Package and Upload
        run: |
          # Zip the directory
          $exePath = "./dist/Gymanager-win32-x64/Gymanager.exe"
          if (Test-Path $exePath) {
            Compress-Archive -Path ./dist/Gymanager-win32-x64/* -DestinationPath ./Gymanager.zip
            Write-Output "Package created at $((Get-Item ./Gymanager.zip).FullName)"
          } else {
            Write-Error "EXE file not found at $exePath"
            exit 1
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gymanager-App
          path: |
            ./Gymanager.zip
            ./dist/Gymanager-win32-x64/
