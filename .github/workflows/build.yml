name: Build Gymanager WebView App

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest  # This ensures the job runs on a Windows machine

    steps:
      # Step 1: Check out the repository code
      - name: Checkout repository
        uses: actions/checkout@v2

      # Step 2: Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16'

      # Step 3: Install Nativefier globally
      - name: Install Nativefier
        run: npm install -g nativefier

      # Step 4: Build the app using Nativefier
      - name: Build the WebView App
        run: nativefier --name "Gymanager" --icon "./assets/gymanager.ico" "https://www.gym.etecxperts.com"

      # Step 5: Upload the generated `.exe` as an artifact
      - name: Upload .exe as artifact
        uses: actions/upload-artifact@v2
        with:
          name: Gymanager-Windows-App
          path: "./Gymanager.exe"  # Adjust the path to where the `.exe` is located
